# بناء متجر vitaS ونشره على GitHub Pages عند كل دفع إلى الفرع الرئيسي.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # يسمح بإطلاق النشر يدوياً من تبويب Actions
  workflow_dispatch:

# الصلاحيات التي يحتاجها deploy-pages وحدها — لا أكثر
permissions:
  contents: read
  pages: write
  id-token: write

# نشرة واحدة في كل مرّة، وبلا إلغاء ما هو قيد التنفيذ
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 يتطلّب Node 20.19+ أو 22.12+ — و22 هو LTS الحالي
          node-version: '22'
          cache: npm

      - run: npm ci

      # `base: '/zahra/'` في vite.config.js يجب أن يطابق اسم المستودع،
      # وإلا سقطت كل الأصول على المسار الفرعي.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
